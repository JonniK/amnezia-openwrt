# /etc/sysctl.d/99-amnezia-resilience.conf  (shipped by amnezia-pbr)
#
# Auto-recover from kernel hangs instead of hanging indefinitely.
# On this AX3000T, procd keeps the 31s hardware watchdog fed even while a
# kernel subsystem is locked up, so a hung kernel can sit dead for hours until
# a manual power-cycle. These knobs turn a *detectable* kernel fault into a
# fast reboot so the router recovers on its own:
kernel.panic = 10               # reboot 10s after a panic
kernel.panic_on_oops = 1        # an oops is fatal -> panic -> reboot
kernel.panic_on_rcu_stall = 1   # RCU stall (a common hang signature) -> panic -> reboot

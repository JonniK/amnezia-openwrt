name: Integration Tests (Tier 2 — real kernel)

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  integration:
    name: Tier-2 real-kernel bats (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bats nftables iproute2 conntrack shellcheck nodejs

      - name: Run unit + integration tests with sudo
        run: |
          sudo bats test/integration test/unit
